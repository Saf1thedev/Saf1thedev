<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="12-month contribution activity">
  <defs>
    <style>
      @keyframes animate {
        0% { stroke-dashoffset: 1000 }
        100% { stroke-dashoffset: 0 }
      }
      .animate {
        animation: animate 3s linear infinite;
        stroke-dasharray: 1000;
      }
    </style>
  </defs>
  <g id="graph-0">
    <rect x="50" y="50" width="500" height="300" fill="#202226" rx="10" />
    <path id="path-0" d="M 50 50 L 550 50" stroke="#cc997f" stroke-width="2" class="animate" />
  </g>
  <!-- Light mode fallback -->
  <style>
    @media (prefers-color-scheme: light) {
      #path-0 { stroke: #cd622b; }
    }
  </style>
</svg>