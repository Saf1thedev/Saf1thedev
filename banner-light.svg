<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Safouane Latrache — Full-Stack Developer, Morocco">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#cd622b"/>
      <stop offset="100%" stop-color="#e07b45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg-light)"/>
  <rect x="80" y="60" width="4" height="160" rx="2" fill="url(#accent-light)"/>
  <text x="110" y="145" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" font-size="48" font-weight="700" fill="#120f11" letter-spacing="-0.5px">Safouane Latrache</text>
  <text x="110" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#cd622b" letter-spacing="0.5px">Full-Stack Developer</text>
  <text x="110" y="232" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#4e4f48" letter-spacing="0.3px">Morocco</text>
  <circle cx="1100" cy="140" r="90" fill="none" stroke="url(#accent-light)" stroke-width="2" opacity="0.3"/>
  <circle cx="1100" cy="140" r="60" fill="none" stroke="#cd622b" stroke-width="1.5" opacity="0.5"/>
</svg>